# ==========================================================
# SYSTEM, KERNEL & MEMORIES
# ==========================================================
CONFIG_HEAP_MEM_POOL_SIZE=81920         
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192 
CONFIG_EVENTS=y
CONFIG_ZBUS=y

# ==========================================================
# CONSOLE & LOGGING
# ==========================================================
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_PICOLIBC_IO_FLOAT=y

# ==========================================================
# SENSORS: BOSCH BMI270 (IMU) & TDK ICP-20100 (BAROMETER)
# ==========================================================
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_SENSOR_ASYNC_API=y

# Bosch BMI270
CONFIG_BMI270=y
CONFIG_BMI270_TRIGGER_GLOBAL_THREAD=y

# TDK InvenSense Barometer
CONFIG_ICP20100=y
CONFIG_ICP20100_TRIGGER_GLOBAL_THREAD=y

# ==========================================================
# UI: DISPLAY, LEDS, & BUZZER
# ==========================================================
# OLED Display
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_CHARACTER_FRAMEBUFFER=y # Optional: Makes writing text to the screen much easier

# PWM, LEDs & Buzzer
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y

# ==========================================================
# POWER MANAGEMENT: NORDIC nPM1300 PMIC
# ==========================================================
CONFIG_MFD_NPM1300=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_NPM1300=y
CONFIG_CHARGER=y
CONFIG_CHARGER_NPM1300=y

# ==========================================================
# POWER MANAGEMENT & DEEP SLEEP
# ==========================================================
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# ==========================================================
# STORAGE: EXTERNAL FLASH & LITTLEFS
# ==========================================================
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_SPI_NOR=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

# ==========================================================
# WI-FI & NATIVE NETWORKING STACK
# ==========================================================
CONFIG_SPI=y
CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y
CONFIG_NET_L2_WIFI_MGMT=y

CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_ETHERNET_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096

CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=20

CONFIG_WIFI_SCAN_BANDS_LIST="2,5"
CONFIG_WIFI_SCAN_INTERVAL_S=15

# ==========================================================
# LTE MODEM & SOCKET OFFLOADING 
# ==========================================================
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_NETWORK_MODE_LTE_M_NBIOT_GPS=y
CONFIG_MODEM_INFO=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_SOCKETS_OFFLOAD=y

# ==========================================================
# MQTT HELPER 
# ==========================================================
CONFIG_MQTT_HELPER=y
CONFIG_MQTT_CLEAN_SESSION=y
CONFIG_MQTT_KEEPALIVE=1200

# ==========================================================
# DIAGNOSTICS: LOGGING SETTINGS
# ==========================================================
CONFIG_NET_LOG=y
CONFIG_WIFI_LOG_LEVEL_INF=y
CONFIG_WIFI_NRF70_LOG_LEVEL_INF=y

CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y