# ==========================================================
# SYSTEM, KERNEL & MEMORY
# ==========================================================
CONFIG_EVENTS=y
CONFIG_ZBUS=y
CONFIG_SMF=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y

# --- ADJUSTED MEMORY LIMITS TO FIT IN RAM ---
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16000

# --- CATCH CRASHES IN HUMAN TEXT ---
CONFIG_HW_STACK_PROTECTION=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

# ==========================================================
# C++ & EDGE IMPULSE SDK (Replaces Picolibc)
# ==========================================================
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_FPU=y

# ==========================================================
# CONSOLE & LOGGING
# ==========================================================
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_STACK_SENTINEL=y             

# ==========================================================
# SENSORS: I2C (BMI270/ICP20100 now driven by raw I2C)
# ==========================================================
CONFIG_I2C=y

CONFIG_ASSERT=y
CONFIG_THREAD_NAME=y
CONFIG_RESET_ON_FATAL_ERROR=n

# ==========================================================
# UI: OLED + PWM LEDs + BUZZER
# ==========================================================
CONFIG_DISPLAY=n
#CONFIG_SSD1306=y
#CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y

# ==========================================================
# PMIC: nPM1300
# ==========================================================
CONFIG_SENSOR=y
CONFIG_MFD_NPM13XX=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_NPM13XX=y
CONFIG_CHARGER=y
CONFIG_NPM13XX_CHARGER=y

# ==========================================================
# WI-FI (SCAN ONLY)
# ==========================================================
CONFIG_SPI=y
CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y
CONFIG_NETWORKING=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_L2_WIFI_MGMT=y

CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y

CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=10000
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=12000


# Enable a random MAC address
CONFIG_WIFI_RANDOM_MAC_ADDRESS=y

# Enable a hardware entropy generator 
CONFIG_ENTROPY_GENERATOR=y

CONFIG_WIFI_LOG_LEVEL_INF=y
CONFIG_WIFI_NRF70_LOG_LEVEL_INF=y
CONFIG_NET_LOG=y

CONFIG_NRF70_RX_NUM_BUFS=4
CONFIG_NET_BUF_RX_COUNT=6
CONFIG_NET_BUF_TX_COUNT=6
CONFIG_NET_PKT_RX_COUNT=4
CONFIG_NET_PKT_TX_COUNT=4

CONFIG_NET_TX_STACK_SIZE=1024
CONFIG_NET_RX_STACK_SIZE=1024


# ==========================================================
# LTE MODEM (nRF9151 — socket offload for MQTT)
# ==========================================================
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_NETWORK_MODE_LTE_M_GPS=y
CONFIG_MODEM_INFO=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y
# RC oscillator — no external 32 kHz crystal on custom PCB
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

CONFIG_NET_IPV6=n

# ==========================================================
# MQTT
# ==========================================================
CONFIG_MQTT_HELPER=y
CONFIG_MQTT_CLEAN_SESSION=y
CONFIG_MQTT_KEEPALIVE=1200

CONFIG_MQTT_BOOTSTRAP_SECURITY_CODE="987654"

CONFIG_MFD_NPM13XX_INIT_PRIORITY=74
CONFIG_REGULATOR_NPM13XX_COMMON_INIT_PRIORITY=75
CONFIG_REGULATOR_NPM13XX_INIT_PRIORITY=76
CONFIG_SENSOR_INIT_PRIORITY=80
CONFIG_WIFI_INIT_PRIORITY=85

CONFIG_BMI270=n
CONFIG_ICP201XX=n

# --- FIX NETWORK INTERFACE ALLOCATION CRASH ---
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=2
CONFIG_NET_MAX_CONTEXTS=4

CONFIG_NET_TCP=n
CONFIG_NET_UDP=y