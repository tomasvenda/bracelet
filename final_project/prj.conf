# ==========================================================
# SYSTEM, KERNEL & MEMORY
# ==========================================================
CONFIG_EVENTS=y
CONFIG_ZBUS=y
CONFIG_SMF=y
CONFIG_HEAP_MEM_POOL_SIZE=16384        
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZBUS_MSG_SUBSCRIBER=y


# ==========================================================
# CONSOLE & LOGGING
# ==========================================================
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y             
CONFIG_PICOLIBC_IO_FLOAT=y

# ==========================================================
# SENSORS: BMI270 (IMU) + ICP20100 (BAROMETER)
# ==========================================================
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_BMI270=y
CONFIG_BMI270_TRIGGER_GLOBAL_THREAD=y
CONFIG_ICP201XX=y
CONFIG_ICP201XX_TRIGGER_GLOBAL_THREAD=y

CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_ASSERT=y
CONFIG_THREAD_NAME=y
CONFIG_EXCEPTION_STACK_TRACE=y
CONFIG_RESET_ON_FATAL_ERROR=n

# ==========================================================
# UI: OLED + PWM LEDs + BUZZER
# ==========================================================
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y

# ==========================================================
# PMIC: nPM1300
# ==========================================================
CONFIG_MFD_NPM13XX=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_NPM13XX=y
CONFIG_CHARGER=y

# ==========================================================
# POWER MANAGEMENT
# ==========================================================
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# ==========================================================
# STORAGE: EXTERNAL NOR FLASH (mx25u32 on SPI)
# ==========================================================
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_SPI_NOR=y
# LittleFS disabled — use NVS when retry queue is implemented
CONFIG_FILE_SYSTEM_LITTLEFS=n

# ==========================================================
# WI-FI (SCAN ONLY)
# ==========================================================
CONFIG_SPI=y
CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y
CONFIG_NETWORKING=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_WIFI_LOG_LEVEL_INF=y

CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y

CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=15000
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=10000

# Enable a random MAC address
CONFIG_WIFI_RANDOM_MAC_ADDRESS=y

# Enable a hardware entropy generator 
CONFIG_ENTROPY_GENERATOR=y

# ==========================================================
# LTE MODEM (nRF9151 — socket offload for MQTT)
# ==========================================================
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_NETWORK_MODE_LTE_M_NBIOT_GPS=y
CONFIG_MODEM_INFO=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y
# RC oscillator — no external 32 kHz crystal on custom PCB
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# ==========================================================
# MQTT
# ==========================================================
CONFIG_MQTT_HELPER=y
CONFIG_MQTT_CLEAN_SESSION=y
CONFIG_MQTT_KEEPALIVE=1200

# ==========================================================
# LOGGING LEVELS (reduce verbosity to save RAM log buffers)
# ==========================================================
CONFIG_NET_LOG=n
CONFIG_WIFI_LOG_LEVEL_WRN=y
CONFIG_WIFI_NRF70_LOG_LEVEL_WRN=y

    
CONFIG_MQTT_BOOTSTRAP_SECURITY_CODE="987654"
