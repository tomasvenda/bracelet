# ==========================================================
# Fall inference app -- prj.conf
# (logger config minus modem/NVS, plus C++ for Edge Impulse)
# ==========================================================

# ==========================================================
# CONSOLE & LOGGING
# ==========================================================
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096
CONFIG_LOG_MODE_IMMEDIATE=y

# ==========================================================
# HARDWARE & PMIC
# ==========================================================
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_REGULATOR=y
CONFIG_MFD_NPM13XX=y
CONFIG_REGULATOR_NPM13XX=y
CONFIG_NPM13XX_CHARGER=y

# Custom clock settings (No crystal, use RC)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# ==========================================================
# EDGE IMPULSE SDK REQUIREMENTS
# The SDK is C++ (TFLite Micro + DSP). NOTE: newlib replaces
# picolibc here, so the old CONFIG_PICOLIBC_IO_FLOAT line is
# gone -- float printf comes from NEWLIB_LIBC_FLOAT_PRINTF.
# ==========================================================
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_FPU=y

# ==========================================================
# MEMORY
# DSP (FFT) and TFLite Micro need real stack + heap. The model
# arena is statically allocated in the generated sources, but
# the spectral-analysis block mallocs working buffers.
# ==========================================================
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_HEAP_MEM_POOL_SIZE=32768

# Keep fatal errors as halts (readable fault dumps) while testing
CONFIG_RESET_ON_FATAL_ERROR=n