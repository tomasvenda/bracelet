# ==========================================================
# CONSOLE & LOGGING
# ==========================================================
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y
CONFIG_PRINTK=y

# Float formatting for printf and JSON payloads
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_PICOLIBC_IO_FLOAT=y

# ==========================================================
# HARDWARE & PMIC 
# ==========================================================
CONFIG_I2C=y
CONFIG_REGULATOR=y
CONFIG_MFD_NPM13XX=y
CONFIG_REGULATOR_NPM13XX=y
CONFIG_NPM13XX_CHARGER=y

# ==========================================================
# SENSORS
# ==========================================================
CONFIG_SENSOR=y
CONFIG_BMI270=y
CONFIG_ICP201XX=y
CONFIG_SENSOR_ASYNC_API=y

# ==========================================================
# MODEM & LTE
# ==========================================================
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_NETWORK_MODE_LTE_M=y

# Custom clock settings (No crystal, use RC)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# ==========================================================
# NETWORKING & MQTT
# ==========================================================
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_MQTT_HELPER=y

# ==========================================================
# MEMORY (16KB needed for formatting 50-item JSON arrays)
# ==========================================================
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=16384

# ==========================================================
# SOCKET OFFLOAD (Route MQTT through the LTE Modem)
# ==========================================================
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y

# ==========================================================
# MQTT STABILITY
# ==========================================================
CONFIG_MQTT_CLEAN_SESSION=y
CONFIG_MQTT_KEEPALIVE=1200