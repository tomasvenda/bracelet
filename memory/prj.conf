# ==========================================
# CORE HARDWARE
# ==========================================
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_I2C=y

# ==========================================
# LOGGING
# ==========================================
CONFIG_LOG=y
CONFIG_LOG_CMDS=y

# ==========================================
# POWER & PMIC (nPM1300)
# ==========================================
CONFIG_REGULATOR=y
CONFIG_MFD_NPM13XX=y
CONFIG_REGULATOR_NPM13XX=y

# ==========================================
# QUARANTINE INTERFERING SYSTEMS
# ==========================================
CONFIG_WIFI=n
CONFIG_NETWORKING=n
CONFIG_NET_L2_WIFI_MGMT=n

# ==========================================
# FLASH (keep off for raw SPI testing)
# ==========================================
CONFIG_FLASH=n

# ==========================================
# STACK SIZE (needed for regulator + SPI)
# ==========================================
CONFIG_MAIN_STACK_SIZE=2048