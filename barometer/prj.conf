# ==========================================================
# CONSOLE & LOGGING
# ==========================================================
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_PICOLIBC_IO_FLOAT=y

# ==========================================================
# I2C BUS & PMIC (Required for bus stability)
# ==========================================================
CONFIG_I2C=y
CONFIG_MFD_NPM13XX=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_NPM13XX=y

# ==========================================================
# SENSORS: TDK ICP-201XX BAROMETER
# ==========================================================
CONFIG_SENSOR=y
CONFIG_ICP201XX=y

# Note: We must also enable the BMI270 because it shares the 
# I2C bus in the overlay, otherwise the linker complains.
CONFIG_BMI270=y