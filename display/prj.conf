# Core peripherals
CONFIG_GPIO=y
CONFIG_I2C=y

# Regulators: nPM1300 LDSWs + OLED power-enable GPIO (P0.26)
CONFIG_REGULATOR=y

# Display + text rendering
CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y

# Console on uart0 for debug output
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y

CONFIG_HEAP_MEM_POOL_SIZE=4096