# ==========================================
# CORE SYSTEM & LOGGING
# ==========================================
CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_LOG_CMDS=y
CONFIG_SHELL=y
CONFIG_MAIN_STACK_SIZE=2048

# Enable floating point numbers for Sensor outputs
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_REQUIRES_FLOAT_PRINTF=y

# ==========================================
# I2C AND HARDWARE DEBUGGING
# ==========================================
CONFIG_I2C=y
# Enables the live terminal command: "i2c scan"
CONFIG_I2C_SHELL=y 

# ==========================================
# POWER & PMIC (nPM1300)
# ==========================================
CONFIG_REGULATOR=y
CONFIG_MFD_NPM13XX=y
CONFIG_REGULATOR_NPM13XX=y
CONFIG_NPM13XX_CHARGER=y

# Fuel Gauge (Optional but recommended if using a battery)
CONFIG_NRF_FUEL_GAUGE=y
CONFIG_NRF_FUEL_GAUGE_VARIANT_SECONDARY_CELL=y

# ==========================================
# SPI & FLASH CONTROLS
# ==========================================
CONFIG_SPI=y
# Keep auto-flash off while you do raw hardware testing
CONFIG_FLASH=n 

# ==========================================
# SENSORS
# ==========================================
CONFIG_SENSOR=y

# ==========================================
# QUARANTINE INTERFERING SYSTEMS
# ==========================================
CONFIG_WIFI=n
CONFIG_NETWORKING=n