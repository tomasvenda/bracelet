# ==========================================================
# CONSOLE & LOGGING
# ==========================================================
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096

# Float formatting for printf and JSON payloads
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_PICOLIBC_IO_FLOAT=y

# ==========================================================
# HARDWARE & PMIC
# ==========================================================
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_REGULATOR=y
CONFIG_MFD_NPM13XX=y
CONFIG_REGULATOR_NPM13XX=y
CONFIG_NPM13XX_CHARGER=y

# Math for sqrtf() in fall processing
CONFIG_FPU=y

# ==========================================================
# FLASH STORAGE (NVS on internal flash) -- OFFLINE LOGGING MODE
# Events are stored in the 'storage_partition' of the nRF9151's
# internal 1MB flash and dumped over UART on button press.
# ==========================================================
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y

# ==========================================================
# MODEM & LTE -- DISABLED FOR OFFLINE FLASH LOGGING
# Re-enable this whole block (and the matching #if 0 blocks in
# main.c) once the battery is attached and the power path can
# handle LTE TX bursts.
# ==========================================================
# CONFIG_NRF_MODEM_LIB=y
# CONFIG_LTE_LINK_CONTROL=y
# CONFIG_LTE_NETWORK_MODE_LTE_M=y
# CONFIG_LTE_PSM_REQ=n
# CONFIG_LTE_EDRX_REQ=n
# CONFIG_LTE_NETWORK_TIMEOUT=600
# CONFIG_LTE_LC_CONN_EVAL_MODULE=y
# CONFIG_MODEM_INFO=n
# CONFIG_LTE_LC_EDRX_MODULE=n

# Custom clock settings (No crystal, use RC)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# ==========================================================
# NETWORKING & MQTT -- DISABLED FOR OFFLINE FLASH LOGGING
# ==========================================================
# CONFIG_NETWORKING=y
# CONFIG_NET_NATIVE=n
# CONFIG_NET_SOCKETS=y
# CONFIG_MQTT_HELPER=y
# CONFIG_NET_SOCKETS_OFFLOAD=y
# CONFIG_POSIX_API=y
# CONFIG_MQTT_CLEAN_SESSION=y
# CONFIG_MQTT_KEEPALIVE=1200

# ==========================================================
# MEMORY
# ==========================================================
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Keep fatal errors as halts (not reboots) while debugging power:
# with this =n, any spontaneous reboot you see IS a power event.
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_POLL=y