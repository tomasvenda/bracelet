# ==========================================================
# CONSOLE & LOGGING
# ==========================================================
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096

# Float formatting for printf and JSON payloads
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_PICOLIBC_IO_FLOAT=y

# ==========================================================
# HARDWARE & PMIC
# ==========================================================
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_REGULATOR=y
CONFIG_MFD_NPM13XX=y
CONFIG_REGULATOR_NPM13XX=y
CONFIG_NPM13XX_CHARGER=y

# Math for sqrtf() in fall processing
CONFIG_FPU=y

# ==========================================================
# MODEM & LTE
# ==========================================================
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y

# ----------------------------------------------------------
# BROWNOUT FIX #1: LTE-M ONLY. No NB-IoT.
#
# The old config had CONFIG_LTE_NETWORK_MODE_LTE_M_NBIOT=y and
# CONFIG_LTE_MODE_PREFERENCE_NBIOT=y further down, which silently
# overrode the LTE_M-only choice (Kconfig choice: last one wins).
#
# Every rejected registration in the logs (EMM cause 18/19) was in
# "LTE mode: 9" = NB-IoT. NB-IoT uses long continuous TX bursts with
# repetitions -> the worst sustained current draw of any mode, and
# each rejection triggered another full-power retry. That is exactly
# when the board browned out.
# ----------------------------------------------------------
CONFIG_LTE_NETWORK_MODE_LTE_M=y

# Custom clock settings (No crystal, use RC)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# ==========================================================
# NETWORKING & MQTT
# ==========================================================
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_MQTT_HELPER=y

# ==========================================================
# MEMORY (16KB needed for formatting 50-item JSON arrays)
# ==========================================================
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_HEAP_MEM_POOL_SIZE=16384

# ==========================================================
# SOCKET OFFLOAD (Route MQTT through the LTE Modem)
# ==========================================================
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y

# ==========================================================
# MQTT STABILITY
# ==========================================================
CONFIG_MQTT_CLEAN_SESSION=y
CONFIG_MQTT_KEEPALIVE=1200

# Keep fatal errors as halts (not reboots) while debugging power:
# with this =n, any spontaneous reboot you see IS a power event.
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_LOG_MODE_IMMEDIATE=y

# ----------------------------------------------------------
# BROWNOUT FIX #2: PSM off (for now).
#
# The old config requested PSM with all-zero timers (RAT="00000000"
# = 0 s active time), which asks the network to put the device to
# sleep immediately after data -- fighting the always-on MQTT
# session and causing extra attach/detach signalling. Re-enable PSM
# with sane timers once the power rail is stable, if you need it.
# (Also removes the duplicate CONFIG_LTE_PSM_REQ line.)
# ----------------------------------------------------------
CONFIG_LTE_PSM_REQ=n
CONFIG_LTE_EDRX_REQ=n

CONFIG_LTE_NETWORK_TIMEOUT=600
CONFIG_LTE_LC_CONN_EVAL_MODULE=y
CONFIG_MODEM_INFO=n
CONFIG_LTE_LC_EDRX_MODULE=n