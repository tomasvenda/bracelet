# Data-collection test build.
#   west build -b <board> -- -DEXTRA_CONF_FILE=overlay-collect-data.conf
#
# Selects collecting_data.c as the app entry (see main.c fork) and pulls in
# the NVS flash storage used to buffer captured windows between dumps.

CONFIG_APP_COLLECT_DATA=y

CONFIG_ZBUS=y

# --- Flash / NVS storage for captured events ---
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_PM_PARTITION_SIZE_NVS_STORAGE=0x40000

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096