CONFIG_APP_POWER_TEST=y

# --- NCS v3.x: lte_lc feature modules must be enabled explicitly ---
CONFIG_LTE_LC_PSM_MODULE=y
CONFIG_LTE_LC_MODEM_SLEEP_MODULE=y
CONFIG_LTE_LC_MODEM_SLEEP_NOTIFICATIONS=y

# --- PSM request (seconds format is supported in v3.3 and clearer) ---
CONFIG_LTE_PSM_REQ=y
CONFIG_LTE_PSM_REQ_FORMAT_SECONDS=y
CONFIG_LTE_PSM_REQ_RPTAU_SECONDS=3600
CONFIG_LTE_PSM_REQ_RAT_SECONDS=0

# TESTING LTE PSM
CONFIG_LTE_RAI_REQ=y