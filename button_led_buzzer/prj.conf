# Console & Logging
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y

# GPIO support for button input
CONFIG_GPIO=y
CONFIG_GPIO_INIT_PRIORITY=50

# PWM and LED support for buzzer + PWM-driven LED
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y

CONFIG_I2C=y
CONFIG_MFD_NPM13XX=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_NPM13XX=y
