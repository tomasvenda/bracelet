# =====================================================
# LTE Cyclic Connection Test - prj.conf
# =====================================================

# --- Logging over UART ---
CONFIG_LOG=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BUFFER_SIZE=4096

# --- Modem & LTE Link Control ---
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y

# Enable both LTE-M and NB-IoT, but PREFER LTE-M.
# The modem will try LTE-M first and only fall back to NB-IoT if needed.
CONFIG_LTE_NETWORK_MODE_LTE_M_NBIOT=y
CONFIG_LTE_MODE_PREFERENCE_LTE_M=y

# (Alternative: force LTE-M ONLY, no NB-IoT fallback.
#  Comment out the two lines above and use this instead:)
# CONFIG_LTE_NETWORK_MODE_LTE_M=y

# --- General system ---
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096

# --- nPM1300 PMIC (charger + regulators on I2C) ---
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_MFD=y
CONFIG_REGULATOR=y
# SENSOR is needed for the npm1300 charger driver (battery voltage readout)
CONFIG_SENSOR=y